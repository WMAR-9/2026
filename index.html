<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <style>
        html,body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            display: grid;
        }

        #a {
            width: min(96vw, calc(96vh*1.6));
            height: min(96vh, calc(96vw/1.6));
            aspect-ratio: 16/10;
            border-radius: 5px;
            margin: auto;
            image-rendering: pixelated;
            touch-action: none;
        }
    </style>    
</head>
<body>
    <canvas id="a"></canvas>
    <script type="module" src="js/index.js"></script>
</body>
</html>
